[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-quant-debugger-backend"
version = "0.1.0"
description = "Trusted quantitative backtest core for Visual Quant Debugger"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=2.1,<3",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=15,<18",
]

[project.scripts]
vqd = "app.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]
framework-backtesting = [
  "backtesting>=0.6.6,<0.7",
]
framework-vectorbt = [
  "vectorbt>=1.1,<2",
  "plotly>=5.24,<7",
]
frameworks = [
  "backtesting>=0.6.6,<0.7",
  "vectorbt>=1.1,<2",
  "plotly>=5.24,<7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -q"
markers = [
  "framework: real optional framework integration test",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
